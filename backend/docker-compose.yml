# Local stack: TimescaleDB + the Milesight API (simulator transport by default).
#   docker compose up --build
# The API applies its own migrations on start (internal/store/postgres/migrations).
services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: milesight
      POSTGRES_PASSWORD: milesight
      POSTGRES_DB: milesight
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milesight"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgres://milesight:milesight@db:5432/milesight?sslmode=disable
      MILESIGHT_ADDR: ":8080"
    ports:
      - "8080:8080"

volumes:
  dbdata:
