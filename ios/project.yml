# XcodeGen spec — generate the Xcode project (not committed):
#   brew install xcodegen && cd ios && xcodegen generate && open Milesight.xcodeproj
# Set your team in DEVELOPMENT_TEAM (or in Xcode → Signing) to run on a device.
name: Milesight
options:
  bundleIdPrefix: com.milesight
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
packages:
  CoreKit:
    path: Packages/CoreKit
  LiveKit:
    path: Packages/LiveKit
  AnalyticsKit:
    path: Packages/AnalyticsKit
  CommandsKit:
    path: Packages/CommandsKit
  NotificationsKit:
    path: Packages/NotificationsKit
targets:
  Milesight:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
    dependencies:
      - package: CoreKit
      - package: LiveKit
      - package: AnalyticsKit
      - package: CommandsKit
      - package: NotificationsKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Milesight
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes: [remote-notification]
        # Default API server; override per build configuration below or in the app.
        MilesightAPIBaseURL: $(MILESIGHT_API_URL)
        CFBundleURLTypes:
          - CFBundleURLName: com.milesight.ios
            CFBundleURLSchemes: [milesight]
        NSAppTransportSecurity:
          # Allows http:// to localhost and LAN addresses for local development only.
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/Milesight.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.milesight.ios
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          MILESIGHT_API_URL: http://localhost:8080
        Release:
          # Replace with your production API before shipping.
          MILESIGHT_API_URL: https://api.example.com
